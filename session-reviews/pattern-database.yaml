document_type: session-review-pattern-database
producer: session-reviewer
created: 2026-06-16
note: >
  Seeded from first dedicated session review (feature-arp-v0.7.0).
  No prior baseline — all entries are first-observed instances.
---

patterns:

  - id: PAT-001
    name: pr-manager-shortstop
    description: >
      pr-manager agent stops at step 6 (APPROVE) without executing steps 7-9
      (merge + confirm CI + consolidated report). Requires orchestrator
      SendMessage intervention to complete.
    first_observed: "feature-arp-v0.7.0"
    occurrences:
      - cycle: "feature-8-dnp3-v0.5.0"
        count: 1
        notes: "DNP3 F5 PR — seeded the pattern"
      - cycle: "feature-arp-v0.7.0"
        count: 5
        notes: "PRs #236/#238/#239/#240/#241 — 5/5 ARP story PRs"
    total_occurrences: 6
    recurrence_rate: "100% (6/6 PRs in scope)"
    proactive_mitigation_tried: true
    mitigation_effective: false
    mitigation_notes: >
      Explicit 'DO NOT STOP AT APPROVE' instruction in STORY-115 dispatch
      did not prevent recurrence #6. Structural prompt change required.
    severity: CRITICAL
    proposal: PROP-01
    status: OPEN

  - id: PAT-002
    name: doc-tense-recurrence
    description: >
      RED-gate / scaffold / stub / todo!() doc-comments written in TDD RED
      phase survive into adversary-surfaced GREEN commits. Recurs after
      policy-text codification (DF-GREEN-DOC-TENSE-SWEEP), confirming that
      policy text alone does not change agent behavior.
    first_observed: "feature-arp-v0.7.0"
    occurrences:
      - cycle: "feature-arp-v0.7.0"
        count: 7
        notes: >
          STORY-112 (PG-ARP-F4-REDBANNER-SWEEP), STORY-113 (O-4),
          STORY-114 F-1/F-2/F-3, STORY-115 C1/F-1 regression tests,
          D-075 regression test (post-codification recurrence)
    total_occurrences: 7
    policy_codified: true
    policy_id: DF-GREEN-DOC-TENSE-SWEEP
    policy_effective: false
    notes: >
      Policy was codified before STORY-115 began; recurred immediately
      in D-075 regression test. Requires agent-prompt injection.
    severity: HIGH
    proposal: PROP-02
    status: OPEN

  - id: PAT-003
    name: fix-induced-regression-from-low
    description: >
      A LOW-severity finding adjudicated FIX without assessing
      fix-induced-regression risk. The fix requires hand-rolling logic
      that the library already abstracts, introducing a MEDIUM regression.
    first_observed: "feature-arp-v0.7.0"
    occurrences:
      - cycle: "feature-arp-v0.7.0"
        finding: "O-A (LOW) → D-078/D-078b + F-1 (MEDIUM)"
        cost: "3 PRs (#247/#248/#249) + 2 F5 streak resets + 1 MEDIUM regression"
    total_occurrences: 1
    severity: HIGH
    proposal: PROP-03
    status: OPEN

  - id: PAT-004
    name: consumer-sweep-gap-post-fixburst
    description: >
      A rename or canonical-symbol update in a BC/VP/spec does not propagate
      to all consuming artifacts. Gap caught reactively by consistency-validator
      rather than proactively by fix agent.
    first_observed: "feature-arp-v0.7.0"
    occurrences:
      - cycle: "feature-arp-v0.7.0"
        instance: "VP-024 v1.8 harness rename (PG-ARP-FIXBURST-CONSUMER-SWEEP)"
        resolution: "revert rename via PR #246"
      - cycle: "feature-arp-v0.7.0"
        instance: "F6 lock + Sub-D surrogate name (PG-CONSISTENCY-AUDIT-CONSUMER-SWEEP)"
        resolution: "caught by F7 consistency-validator; 4 gaps remediated"
    total_occurrences: 2
    severity: HIGH
    proposal: PROP-04
    status: OPEN

  - id: PAT-005
    name: holdout-catches-value-semantics-misses
    description: >
      Holdout evaluation catches field-value semantics defects (e.g., Verdict::Possible
      vs Verdict::Likely) that consistency-validator misses because the validator
      checks structure, not value. Demonstrates tool complementarity.
    first_observed: "feature-arp-v0.7.0"
    occurrences:
      - cycle: "feature-arp-v0.7.0"
        finding: "D-075 — D1 verdict Possible vs Likely; caught by holdout static scenarios"
        missed_by: ["consistency-validator", "4 prior adversary passes"]
    total_occurrences: 1
    severity: HIGH
    proposal: null
    notes: >
      Positive validation of holdout design; no workflow change needed.
      Reference when justifying holdout overhead.
    status: DOCUMENTED-POSITIVE

  - id: PAT-006
    name: multipass-adversary-catches-single-pass-misses
    description: >
      Multi-pass adversarial convergence (3 fresh-context passes) catches whole-attack-class
      structural gaps that single-pass review misses. Provides concrete evidence for
      retaining 3-pass requirement.
    first_observed: "feature-arp-v0.7.0"
    occurrences:
      - cycle: "feature-arp-v0.7.0"
        finding: "GARP-storm bypass (C1 in STORY-115) — missed by pass 1, found by passes 2/3"
        mechanism: "DF-BC-COMPLETENESS-SWEEP + GARP/D3 interaction axis"
      - cycle: "feature-arp-v0.7.0"
        finding: "D-077 CRITICAL — missed by 4 passes + holdout; found by human-directed re-streak"
    total_occurrences: 2
    severity: HIGH
    proposal: null
    notes: >
      Positive validation of 3-pass and BC-completeness-sweep requirements.
      Reference when justifying adversary convergence overhead.
    status: DOCUMENTED-POSITIVE

  - id: PAT-007
    name: f7-doc-spec-currency-wave
    description: >
      Multiple fix-bursts landing during F7 each generate a downstream consuming-surface
      propagation gap that the next adversary round finds. The resulting cascade extends
      F7 by 1-2 rounds per burst. Root cause: fix-bursts during F7 are dispatched with
      a narrow remediation scope and do not include a post-burst consuming-surface sweep.
      DF-CONSISTENCY-AUDIT-POST-FIXBURST-001 policy exists but is not enforced as a
      blocking checklist item at the point of dispatch.
    first_observed: "feature-story-119-grouped-collapse"
    occurrences:
      - cycle: "feature-story-119-grouped-collapse"
        count: 4
        notes: >
          R1 (CHANGELOG/release-config) -> R2 (provenance-leak + #[non_exhaustive]) ->
          R3 (ADR anchor drift) -> R4 (BC Architecture Anchors + story post-delivery notes).
          Each burst generated its own propagation gap found in the next round.
    total_occurrences: 1
    severity: HIGH
    proposal: PROP-E18-01
    status: OPEN

  - id: PAT-008
    name: release-config-approval-prompt-self-falsification
    description: >
      release-config.yaml human_approval_prompt embeds a point-in-time status snapshot
      (e.g., "Round-2 pending / remediation-in-flight") that self-falsifies when the
      state advances. The opener "All quality gates are satisfied" may be copied from a
      prior template without matching the current held/in-progress status.
    first_observed: "feature-story-119-grouped-collapse"
    occurrences:
      - cycle: "feature-story-119-grouped-collapse"
        notes: >
          F7-R2 Pass C findings F-PASSC-001/2/3 -- remediated via D-130 burst.
          Codified: prompt MUST reference STATE.md as source-of-truth, not embed inline status.
    total_occurrences: 1
    severity: MEDIUM
    proposal: null
    status: RESOLVED-CODIFIED

  - id: PAT-009
    name: adversary-stale-git-ref-false-alarm
    description: >
      Adversary subagents operating in isolated sandboxes can report a stale git HEAD SHA
      while reviewing the correct live file contents. This generates a false-alarm finding
      that consumes one remediation burst before being closed. Confirmed mitigation:
      orchestrator supplies verified HEAD SHA in adversary dispatch prompt preamble.
    first_observed: "feature-story-119-grouped-collapse"
    occurrences:
      - cycle: "feature-story-119-grouped-collapse"
        notes: "D-105 -- F5 post-merge anchor re-validation against spec-branch HEAD"
      - cycle: "feature-story-119-grouped-collapse"
        notes: "E-8 F7 consistency audit stale-field instance"
      - cycle: "feature-story-119-grouped-collapse"
        notes: >
          F7-R4 Pass C (D-131) -- adversary reported develop HEAD == 31d1231/8696448
          when actual was 1c89b52. Closed as false alarm; confirmed mitigation applied in R5
          (orchestrator supplied verified HEAD; R5 found 0 findings).
    total_occurrences: 3
    confirmed_mitigation: >
      Orchestrator supplies `git rev-parse HEAD` at dispatch time; adversary preamble
      states "treat <SHA> as ground truth if your tooling differs."
    mitigation_applied_in: "F7-R5 (zero SHA discrepancy reported; R5 CLEAN)"
    additional_confirmation: >
      v0.12.0-release-chain: ZERO stale-SHA false alarms across wave-71 (7 passes) and
      wave-72 (4 passes) — 11 consecutive adversary passes with no recurrence.
      Mitigation confirmed durable. Status advanced to RESOLVED-EFFECTIVE 2026-07-10.
    severity: MEDIUM
    proposal: PROP-E18-02
    status: RESOLVED-EFFECTIVE  # updated 2026-07-10; zero recurrences across 11 passes

  - id: PAT-010
    name: wave-gate-fix-pr-recurring
    description: >
      Wave integration gate adversary (Pass 1) finds something that per-story
      adversary passes missed due to scope restriction. Requires a gate-fix PR
      to address the finding before the gate can declare CONVERGED. Not a design
      failure — wave-level adversary is supposed to find these. Pattern documents
      the expected frequency and class of findings.
    first_observed: "v0.12.0-release-chain"
    occurrences:
      - cycle: "v0.12.0-release-chain"
        wave: "wave-71"
        finding: "F-W71-P1-001 MEDIUM: unreleased changelog entries missing"
        gate_fix_pr: 381
      - cycle: "v0.12.0-release-chain"
        wave: "wave-72"
        finding: "F-W72G-P1-001 HIGH: action-pin-gate CI job scanned 0 files (missing existence guard)"
        gate_fix_pr: 391
    total_occurrences: 2
    recurrence_rate: "2/3 wave gates in this period"
    notes: >
      Gate-fix PRs are expected. The wave-level adversary provides integration coverage
      that per-story scope cannot. Two consecutive occurrences suggest this is a normal
      operating rhythm, not a process failure. Bundle gate-fix PRs where possible
      (PR #391 bundled CI guard + security + code-review fixes efficiently).
    severity: MEDIUM
    proposal: null
    status: DOCUMENTED-POSITIVE

  - id: PAT-011
    name: breaking-change-holdout-staleness
    description: >
      A story that introduces a BREAKING observable output change (enum casing,
      schema structure, JSON field names) produces stale holdout scenario expectations
      that are not caught during per-story delivery. All stale expectations land as
      unplanned gate work at the wave integration gate, requiring product-owner repair.
      Root cause: per-story TDD does not exercise holdout-scenario files
      (.factory/holdout-scenarios/), and no delivery checklist item requires a
      pre-PR holdout expectation sweep.
    first_observed: "v0.12.0-release-chain"
    occurrences:
      - cycle: "v0.12.0-release-chain"
        story: "STORY-160"
        breaking_change: "JSON enum casing PascalCase → lowercase/snake_case + schema_version envelope"
        stale_scenarios: 13
        repair_effort: "product-owner at wave gate (unplanned); HS-INDEX v2.13"
    total_occurrences: 1
    severity: HIGH
    proposal: PROP-V0.12.0-01
    status: OPEN

  - id: PAT-012
    name: docs-agent-content-fabrication
    description: >
      A docs-writer or technical-writer agent produces documentation that contains
      fabricated content: invented vocabulary not in any BC/spec, non-existent
      citations (e.g., ADR that does not exist), or inverted technical claims
      (e.g., "condition X produces no findings" when ground-truth code produces
      findings under condition X). All three classes are HIGH-severity user-facing
      defects. Root cause: docs agents under heavy context load paraphrase incorrectly,
      fill gaps with invented content, and adopt incorrect vocabulary from ambient
      context. Strict 3/3 adversarial convergence catches the defects before merge.
    first_observed: "v0.12.0-release-chain"
    occurrences:
      - cycle: "v0.12.0-release-chain"
        run: "maint-2026-07-09 Route A PR #393"
        findings:
          - "F-RA-P1-001 HIGH: invented tri-state vocabulary (HIGH/MEDIUM/LOW ARP scan-interval rating)"
          - "F-RA-P2-001 HIGH: fabricated ADR-0008 citation (ADR-0008 does not exist)"
          - "F-RA-P3-001 HIGH: inverted VLAN/QinQ/MACsec claim (stated 'no findings'; code produces findings)"
        all_caught_before_merge: true
        passes_to_convergence: 6  # 3 finding rounds + 3 clean streak
    total_occurrences: 1
    mitigation: "Strict 3/3 adversarial convergence for all docs PRs; adversary code-traces claims against src/"
    severity: HIGH
    proposal: PROP-V0.12.0-02
    status: OPEN

  - id: PAT-013
    name: background-adversary-relay-unreliable
    description: >
      Background-dispatched adversary agents with large output complete their analysis
      internally but fail to relay the final report back to the orchestrator session.
      The completed report is buffered but not emitted. Requires synchronous re-dispatch
      to recover. Specific to adversary agents; other background agent types not observed
      to have this issue.
    first_observed: "v0.12.0-release-chain"
    occurrences:
      - cycle: "v0.12.0-release-chain"
        run: "maint-2026-07-08"
        incidents: 2
        affected_prs: ["#382 Pass 2", "#383 convergence pass"]
        workaround: "synchronous re-dispatch (run_in_background: false)"
    total_occurrences: 2
    confirmed_mitigation: >
      Dispatch adversary agents with run_in_background: false for maintenance PRs.
      Background dispatch acceptable only for clearly bounded, short-output tasks.
    severity: MEDIUM
    proposal: PROP-V0.12.0-03
    status: OPEN

  - id: PAT-014
    name: subagent-merge-auth-relay-blocked
    description: >
      pr-manager sub-agent dispatched with merge authorization relayed via
      teammate-message cannot execute gh pr merge. The harness permission classifier
      blocks the merge because the authorization signal must originate in the main
      conversation thread to be visible to the classifier. The sub-agent receives the
      authorization message but the classifier rejects the action. Orchestrator
      executing in the main thread under direct user authorization succeeds.
      This is CORRECT harness behavior, not a bug; the factory dispatch protocol
      must account for it.
    first_observed: "v0.12.0-release-chain"
    occurrences:
      - cycle: "v0.12.0-release-chain"
        run: "maint-2026-07-09"
        pr: 393
        finding: "PG-MERGE-AUTH-SUBAGENT-CLASSIFIER"
        workaround: "orchestrator merged in main thread under direct user auth"
        codified_in: "STORY-163 AC-163-002"
    total_occurrences: 1
    confirmed_mitigation: >
      Do not dispatch pr-manager expecting autonomous merge completion when the
      merge authorization was given to the main thread. Plan one main-thread merge
      step per PR for maintenance runs. See .factory/maintenance/pr-manager-merge-auth-guidance.md.
    severity: MEDIUM
    proposal: PROP-V0.12.0-05  # STORY-163 AC-163-002 covers codification
    status: CODIFIED  # STORY-163 AC-163-002

